# Vérifications à chaque push : formatage, lint, tests unitaires puis tests navigateur.
# Elles signalent seulement : la publication du site ne dépend pas de leur résultat.
name: Vérifications

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verifications:
    name: npm run check et tests navigateur
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      # Même commande que npm run test:browser, avec une annotation GitHub par test en échec.
      - name: Tests navigateur
        run: >-
          node --test --test-concurrency=1
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=./tools/github-reporter.js --test-reporter-destination=stdout
          "tests/browser/*.browser.js"
